<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile | HireSense</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="bg-light">
    {% include 'navbar.html' %}

    <main class="container py-5" style="margin-top: 0px; max-width: 900px;">
        <div class="row justify-content-center">
            <div class="col-lg-10">
                <div class="d-flex flex-column flex-sm-row justify-content-between align-items-sm-center gap-3 mb-4">
                    
                    <a href="{{ url_for('dashboard') }}" class="btn btn-outline-dark align-self-start">&larr; Back to dashboard</a>
                </div>

                <form action="{{ url_for('edit') }}" method="post" class="card border-0 shadow-sm rounded-4 overflow-hidden">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                    <div class="card-body p-4 p-md-5">
                        <div class="d-flex align-items-center gap-3 pb-4 mb-4 border-bottom">
                            <img src="https://ui-avatars.com/api/?name={{ user['name']|urlencode }}&background=212529&color=fff&size=72" width="72" height="72" class="rounded-circle" alt="Profile avatar">
                            <div>
                                <h2 class="h5 fw-bold mb-1 text-start">{{ user['name'] }}</h2>
                                <p class="text-muted mb-0">Update the information shown on your candidate dashboard.</p>
                            </div>
                        </div>

                        <h3 class="h5 fw-bold mb-3">Contact information</h3>
                        <div class="row g-3 mb-5">
                            <div class="col-md-6">
                                <label for="full_name" class="form-label fw-semibold">Full name <span class="text-danger">*</span></label>
                                <input id="full_name" type="text" name="full_name" class="form-control" value="{{ user['name'] if user else '' }}" placeholder="Enter your full name" required>
                            </div>
                            <div class="col-md-6">
                                <label for="email" class="form-label fw-semibold">Email address <span class="text-danger">*</span></label>
                                <input id="email" type="email" name="email" class="form-control" value="{{ user['email'] if user else '' }}" placeholder="you@example.com" required>
                            </div>
                            <div class="col-12">
                                <label for="linkedin_url" class="form-label fw-semibold">LinkedIn profile</label>
                                <input id="linkedin_url" type="url" name="linkedin_url" class="form-control" value="{{ user['linkedin_url'] or '' if user else '' }}" placeholder="https://www.linkedin.com/in/your-name">
                            </div>
                        </div>

                        <h3 class="h5 fw-bold mb-3">Professional information</h3>
                        <div class="row g-3">
                            <div class="col-12">
                                <label for="education" class="form-label fw-semibold">Education</label>
                                <textarea id="education" name="education" class="form-control" rows="3" placeholder="Example: B.Tech in Computer Science, ABC University">{{ user['education'] or '' if user else '' }}</textarea>
                            </div>
                            <div class="col-12">
                                <label for="work_experience" class="form-label fw-semibold">Work experience</label>
                                <textarea id="work_experience" name="work_experience" class="form-control" rows="5" placeholder="Briefly describe your work experience, internships, or notable projects.">{{ user['work_experience'] or '' if user else '' }}</textarea>
                            </div>
                            <div class="col-12">
                                <label for="resume_url" class="form-label fw-semibold">Portfolio or resume URL</label>
                                <input id="resume_url" type="url" name="resume_url" class="form-control" value="{{ user['resume_url'] or '' if user else '' }}" placeholder="https://example.com/portfolio-or-resume">
                                <div class="form-text">Add a public link to your portfolio, résumé, or professional website.</div>
                            </div>
                        </div>
                    </div>

                    <div class="card-footer bg-white border-top p-4 d-flex flex-column flex-sm-row justify-content-end gap-2">
                        <a href="{{ url_for('dashboard') }}" class="btn btn-light">Cancel</a>
                        <button type="submit" class="btn btn-dark px-4">Save changes</button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    {% include 'footer.html' %}
</body>
</html>
